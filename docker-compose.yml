services:
  postgres:
    image: postgres:18
    container_name: url-shortener-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
      POSTGRES_DB: urlshortener

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: